spring:
  application:
    name: excel-batch-application
  datasource:
    url: jdbc:mysql://localhost:3306/excel_batch
    password: 123456789
    username: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: 'create-drop'
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: ALWAYS
    job:
      enabled: false
