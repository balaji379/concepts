spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/api/employee-service/**
              filters:
                - AuthenticationFilter
            - id: address-service
              uri: lb://address-service
              predicates:
                - Path=/api/address-service/**
              filters:
                - AuthenticationFilter
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/