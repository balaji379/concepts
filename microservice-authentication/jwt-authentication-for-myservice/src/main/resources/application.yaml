server:
  port: 8003
spring:
  application:
    name: jwt-authentication-for-myservice
  datasource:
    url: jdbc:mysql://localhost:3306/vb
    password: 123456789
    username: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


